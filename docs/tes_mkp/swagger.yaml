basePath: /api/v1
definitions:
  auth.ErrorDetail:
    properties:
      code:
        example: INVALID_CREDENTIALS
        type: string
      message:
        example: Invalid email or password
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/auth.ErrorDetail'
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: admin@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 86400
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  main.HealthResponse:
    properties:
      status:
        example: UP
        type: string
      timestamp:
        example: "2026-09-26T10:00:00Z"
        type: string
    type: object
  schedule.CreateScheduleRequest:
    properties:
      end_time:
        example: "2026-10-01T21:10:00+07:00"
        type: string
      movie_id:
        example: 1
        type: integer
      start_time:
        example: "2026-10-01T19:00:00+07:00"
        type: string
      studio_id:
        example: 1
        type: integer
    required:
    - end_time
    - movie_id
    - start_time
    - studio_id
    type: object
  schedule.ErrorDetail:
    properties:
      code:
        example: SCHEDULE_NOT_FOUND
        type: string
      message:
        example: Schedule not found
        type: string
    type: object
  schedule.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/schedule.ErrorDetail'
    type: object
  schedule.ListScheduleResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/schedule.ScheduleDTO'
        type: array
    type: object
  schedule.ScheduleDTO:
    properties:
      end_time:
        example: "2026-10-01T21:10:00+07:00"
        type: string
      id:
        example: 1
        type: integer
      movie_id:
        example: 1
        type: integer
      start_time:
        example: "2026-10-01T19:00:00+07:00"
        type: string
      status:
        example: SCHEDULED
        type: string
      studio_id:
        example: 1
        type: integer
    type: object
  schedule.SingleScheduleResponse:
    properties:
      data:
        $ref: '#/definitions/schedule.ScheduleDTO'
    type: object
  schedule.UpdateScheduleRequest:
    properties:
      end_time:
        example: "2026-10-01T22:10:00+07:00"
        type: string
      movie_id:
        example: 1
        type: integer
      start_time:
        example: "2026-10-01T20:00:00+07:00"
        type: string
      studio_id:
        example: 2
        type: integer
    required:
    - end_time
    - movie_id
    - start_time
    - studio_id
    type: object
host: localhost:8088
info:
  contact: {}
  description: Enterprise Cinema Ticket Reservation Backend API with JWT Authentication
    and Screening Schedule Management
  title: Cinema Ticket System API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user using email and password to obtain a JWT access
        token
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: User login
      tags:
      - Authentication
  /health:
    get:
      description: Returns the operational health status of the Cinema Ticket System
        API server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: System Health Check
      tags:
      - System
  /schedules:
    get:
      consumes:
      - application/json
      description: Retrieve all movie screening schedules
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schedule.ListScheduleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get schedule list
      tags:
      - Schedules
    post:
      consumes:
      - application/json
      description: Create a new movie screening schedule (Admin only)
      parameters:
      - description: New schedule payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schedule.CreateScheduleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schedule.SingleScheduleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new schedule
      tags:
      - Schedules
  /schedules/{id}:
    delete:
      consumes:
      - application/json
      description: Logically cancel a screening schedule (Admin only)
      parameters:
      - description: Schedule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel schedule
      tags:
      - Schedules
    get:
      consumes:
      - application/json
      description: Retrieve detailed information for a single screening schedule
      parameters:
      - description: Schedule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schedule.SingleScheduleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get schedule by ID
      tags:
      - Schedules
    put:
      consumes:
      - application/json
      description: Update an existing screening schedule (Admin only)
      parameters:
      - description: Schedule ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated schedule payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schedule.UpdateScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schedule.SingleScheduleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schedule.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update schedule
      tags:
      - Schedules
securityDefinitions:
  BearerAuth:
    description: Enter 'Bearer <token>' for authorization
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
